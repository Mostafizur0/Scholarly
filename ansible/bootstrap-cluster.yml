---
# Bootstraps a local k3s cluster (intended to run inside a Colima or
# Multipass VM on macOS). Idempotent — safe to re-run.
#
# Usage: ansible-playbook -i inventory/local ansible/bootstrap-cluster.yml
- name: Bootstrap local k3s cluster
  hosts: local
  become: true
  tasks:
    - name: Install k3s
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Ensure kubeconfig is readable
      ansible.builtin.file:
        path: /etc/rancher/k3s/k3s.yaml
        mode: "0644"

    # Next: copy kubeconfig to ~/.kube/config on the host, or set KUBECONFIG
    # to point at it directly.
