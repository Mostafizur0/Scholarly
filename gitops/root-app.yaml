# ArgoCD app-of-apps root Application.
# Apply once with: kubectl apply -f gitops/root-app.yaml -n argocd
# ArgoCD will then discover and sync every Application under gitops/apps/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scholarship-chatbot-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<your-org>/scholarship-chatbot.git
    targetRevision: main
    path: gitops/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
